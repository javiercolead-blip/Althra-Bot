# Where the scouts look. Add / remove freely.
#
# type: rss   -> any RSS or Atom feed (most contest blogs are WordPress: add /feed/)
# type: html  -> a listing page; give CSS selectors for each contest block
# region: canada -> the site only lists Canadian contests, so treat them as
#                   open to Canada unless the post says otherwise
#
# Each run's log shows "[scout] <name>: N items" or "FAILED (...)" per source.

sources:
  - name: Contest Canada          # ✅ 25 items on first run — the best source so far
    type: rss
    url: https://www.contestcanada.net/feed/
    region: canada

  - name: Canadian Contests       # ✅ 10 items on first run
    type: rss
    url: https://www.canadiancontests.ca/feed/
    region: canada

  # ---- failed on the first run (2026-11-24) -----------------------------
  - name: Contest Queen           # 404: no feed at this address
    type: rss
    enabled: false
    url: https://contestqueen.ca/feed/

  - name: Best Canadian Contests  # domain doesn't exist
    type: rss
    enabled: false
    url: https://www.bestcanadiancontests.com/feed/

  - name: r/CanadianContests      # 404: subreddit not found
    type: rss
    enabled: false
    url: https://www.reddit.com/r/CanadianContests/new/.rss

  - name: RedFlagDeals Contests   # 403: blocks automated requests
    type: rss
    enabled: false
    url: https://forums.redflagdeals.com/feed/forum/20
